<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horaires Naolib Nantes - Temps Réel</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .board {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 500px;
            border: 2px solid #22c55e; /* Couleur Naolib verte */
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .status {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-bottom: 20px;
        }
        .horaire-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #333;
        }
        .ligne-badge {
            background-color: #22c55e;
            color: black;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 6px;
            min-width: 30px;
            text-align: center;
        }
        .direction {
            flex-grow: 1;
            margin-left: 15px;
            font-size: 16px;
        }
        .temps {
            font-weight: bold;
            color: #f59e0b; /* Orange pour le temps d'attente style afficheur */
            font-size: 18px;
        }
        .loading {
            text-align: center;
            color: #888;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="board">
    <h1 id="nom-arret">Chargement de l'arrêt...</h1>
    <div class="status" id="status-update">Mise à jour en cours...</div>
    
    <div id="horaires-container">
        <div class="loading">Récupération des prochains passages...</div>
    </div>
</div>

<script>
    // Configuration : Code de l'arrêt à afficher
    // Exemples : "COMM" (Commerce), "GMAR" (Gare Maritime), "50OT" (50 Otages)
    const CODE_ARRET = "GMAR"; 

    // URL de l'API temps réel officielle (Format JSON ouvert)
    const API_URL = `https://tan.fr{CODE_ARRET}`;

    async function chargerHoraires() {
        const container = document.getElementById('horaires-container');
        const status = document.getElementById('status-update');
        const title = document.getElementById('nom-arret');

        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('Erreur réseau');
            
            const data = await response.json();
            
            // Si l'arrêt ne renvoie rien
            if (data.length === 0) {
                container.innerHTML = '<div class="loading">Aucun passage prévu pour le moment.</div>';
                return;
            }

            // Met à jour le titre avec le nom réel de l'arrêt
            title.textContent = data[0].terminus; // Utilise par défaut le terminus ou le nom de l'arrêt reçu
            
            // Nettoie le conteneur
            container.innerHTML = '';

            // Génère l'affichage pour chaque ligne
            data.forEach(passage => {
                const item = document.createElement('div');
                item.className = 'horaire-item';

                // Gère l'affichage du temps ("proche" ou les minutes)
                let tempsAffichage = passage.temps;
                if (tempsAffichage.toLowerCase() === "proche") {
                    tempsAffichage = "Proche";
                }

                item.innerHTML = `
                    <span class="ligne-badge">${passage.ligne.numLigne}</span>
                    <span class="direction">${passage.terminus}</span>
                    <span class="temps">${tempsAffichage}</span>
                `;
                container.appendChild(item);
            });

            // Met à jour l'heure de la dernière actualisation
            const maintenant = new Date();
            status.textContent = `Mis à jour à ${maintenant.toLocaleTimeString('fr-FR')}`;

        } catch (error) {
            console.error('Erreur lors du fetch:', error);
            status.textContent = "Erreur de connexion aux serveurs Naolib.";
        }
    }

    // Premier chargement au lancement de la page
    chargerHoraires();

    // Actualisation automatique toutes les 30 secondes (30000 ms)
    setInterval(chargerHoraires, 30000);
</script>

</body>
</html>
